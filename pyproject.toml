[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-scanner"
version = "1.0.0"
description = "CLI Windows para inventário de câmeras IP, conforme o escopo governado do projeto."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "av==19.0.1",
    "onvif-python==0.4.4",
    "openpyxl==3.1.5",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "rich==15.0.0",
    "zeep==4.3.3",
]

[project.scripts]
cam-scanner = "cam_scanner.main:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pyinstaller==6.22.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
